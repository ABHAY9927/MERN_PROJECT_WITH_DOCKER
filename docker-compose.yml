version: '3.8'

services:
  mongo:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"

  backend:
    build:
      context: .        
      dockerfile: backend/Dockerfile
    container_name: backend
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/proshop
      - NODE_ENV=development
    volumes:
      - .:/app
    restart: always

  frontend:
    build:
      context: .          
      dockerfile: frontend/Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
    - NODE_OPTIONS=--openssl-legacy-provider
    depends_on:
      - backend
    volumes:
      - ./:/app   
    stdin_open: true
    tty: true